<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats for {{ link.code }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 640px;">
        <h1 class="mb-4">Stats for /{{ link.code }}</h1>
        <table class="table">
            <tr><th>Destination</th><td class="text-break">{{ link.long_url }}</td></tr>
            <tr><th>Clicks</th><td>{{ link.clicks }}</td></tr>
            <tr><th>Created</th><td>{{ link.created_at.strftime('%Y-%m-%d %H:%M UTC') }}</td></tr>
        </table>
        <a href="/">Shorten another</a>
    </div>
</body>
</html>
